<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Page Not Found')}"></head>
<body>

    <header th:replace="~{fragments/layout :: navbar}"></header>

    <main class="py-5">
        <div class="container text-center py-5">
            <div class="stat-icon stat-icon-purple mx-auto mb-4" style="width: 80px; height: 80px; font-size: 2.5rem;">
                <i class="bi bi-compass"></i>
            </div>
            <h1 class="display-4 fw-bold mb-2">404 - Page Not Found</h1>
            <p class="lead text-secondary mb-4">
                The course, page, or resource you are searching for does not exist or may have been moved.
            </p>
            <div class="d-flex justify-content-center gap-2">
                <a th:href="@{/courses}" class="btn-primary-gss">
                    <i class="bi bi-grid"></i> Browse Course Catalogue
                </a>
                <a th:href="@{/}" class="btn btn-outline-gss">
                    <i class="bi bi-house"></i> Return Home
                </a>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
