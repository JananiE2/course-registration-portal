<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('System Error')}"></head>
<body>

    <header th:replace="~{fragments/layout :: navbar}"></header>

    <main class="py-5">
        <div class="container text-center py-5">
            <div class="stat-icon stat-icon-amber mx-auto mb-4" style="width: 80px; height: 80px; font-size: 2.5rem;">
                <i class="bi bi-exclamation-triangle"></i>
            </div>
            <h1 class="display-4 fw-bold mb-2">500 - System Error</h1>
            <p class="lead text-secondary mb-4" th:text="${errorMessage != null ? errorMessage : 'An unexpected error occurred while processing your request.'}">
                An error occurred while processing your request.
            </p>
            <div class="d-flex justify-content-center gap-2">
                <a th:href="@{/}" class="btn-primary-gss">
                    <i class="bi bi-house"></i> Return Home
                </a>
                <a th:href="@{/login}" class="btn btn-outline-gss">
                    <i class="bi bi-person"></i> Log In Again
                </a>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
