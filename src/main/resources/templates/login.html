<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Portal Login')}"></head>
<body>

    <header th:replace="~{fragments/layout :: navbar}"></header>
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <main class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-5">
                    <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                        <div class="card-top-accent"></div>
                        <div class="p-4 p-md-5">
                            <div class="text-center mb-4">
                                <a th:href="@{/}">
                                    <img th:src="@{/images/gsslogo.png}" alt="Gateway Software Solutions" class="mb-3" style="max-height: 48px; width: auto; object-fit: contain;">
                                </a>
                                <h3 class="fw-bold mb-1">Gateway Portal Login</h3>
                                <p class="text-muted small">Sign in to your student account or admin dashboard</p>
                            </div>

                            <form th:action="@{/login}" th:object="${loginDto}" method="post">
                                <input type="hidden" name="redirect" th:value="${redirect}" />

                                <div class="mb-3">
                                    <label for="email" class="form-label">Email Address</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light text-secondary border-end-0"><i class="bi bi-envelope"></i></span>
                                        <input type="email" class="form-control border-start-0" id="email" th:field="*{email}" placeholder="name@domain.com" required>
                                    </div>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                                </div>

                                <div class="mb-4">
                                    <label for="password" class="form-label">Password</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light text-secondary border-end-0"><i class="bi bi-lock"></i></span>
                                        <input type="password" class="form-control border-start-0" id="password" th:field="*{password}" placeholder="Enter your password" required>
                                    </div>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                                </div>

                                <div class="d-grid mb-4">
                                    <button type="submit" class="btn-primary-gss justify-content-center py-2 fs-6">
                                        <i class="bi bi-box-arrow-in-right"></i> Sign In
                                    </button>
                                </div>
                            </form>

                            <div class="text-center pt-2 border-top">
                                <span class="text-muted small">New to Gateway Course Portal?</span>
                                <a th:href="@{/register}" class="small fw-bold ms-1" style="color: var(--primary);">Create an account</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
