<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Manage Courses')}"></head>
<body>

    <header th:replace="~{fragments/layout :: navbar}"></header>
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <main class="py-5">
        <div class="container">
            <!-- Header -->
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
                <div>
                    <span class="badge bg-secondary-subtle text-secondary px-3 py-1 rounded-pill small fw-bold mb-2 d-inline-block">Admin Course Management</span>
                    <h2 class="fw-bold mb-0">Course Catalogue Directory</h2>
                    <p class="text-muted mb-0">Create, update curriculum, set training fees, and manage course status.</p>
                </div>
                <a th:href="@{/admin/courses/new}" class="btn-primary-gss">
                    <i class="bi bi-plus-lg"></i> Add New Course
                </a>
            </div>

            <!-- Filter Card -->
            <div class="card border-0 shadow-sm rounded-4 p-3 bg-white mb-4">
                <form th:action="@{/admin/courses}" method="get" class="row g-2 align-items-center">
                    <div class="col-md-5">
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-search"></i></span>
                            <input type="text" name="keyword" th:value="${keyword}" class="form-control border-start-0" placeholder="Search by name or keywords...">
                        </div>
                    </div>
                    <div class="col-md-4">
                        <select name="category" class="form-select">
                            <option value="">All Categories / Streams</option>
                            <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}" th:selected="${selectedCategory == cat}"></option>
                        </select>
                    </div>
                    <div class="col-md-3 d-flex gap-2">
                        <button type="submit" class="btn btn-primary-gss w-100 justify-content-center">
                            <i class="bi bi-funnel"></i> Filter
                        </button>
                        <a th:href="@{/admin/courses}" class="btn btn-outline-secondary" title="Reset">
                            <i class="bi bi-arrow-counterclockwise"></i>
                        </a>
                    </div>
                </form>
            </div>

            <!-- Course Table -->
            <div class="card border-0 shadow-sm rounded-4 bg-white overflow-hidden">
                <div class="table-responsive">
                    <table class="table-custom mb-0">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Course Name</th>
                                <th>Category</th>
                                <th>Duration</th>
                                <th>Training Fee</th>
                                <th>Status</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(courses)}">
                                <td colspan="7" class="text-center py-5 text-muted">No courses found matching criteria.</td>
                            </tr>
                            <tr th:each="course, iter : ${courses}">
                                <td class="text-muted small" th:text="${iter.count}">1</td>
                                <td>
                                    <strong class="d-block text-dark" th:text="${course.courseName}">Course Name</strong>
                                    <small class="text-muted" th:text="${#strings.abbreviate(course.description, 80)}">Description</small>
                                </td>
                                <td>
                                    <span class="badge-category" th:text="${course.category}">Web Tech</span>
                                </td>
                                <td th:text="${course.duration}">8 Weeks</td>
                                <td class="fw-bold text-dark" th:text="'₹' + ${#numbers.formatDecimal(course.fee, 0, 'COMMA', 2, 'POINT')}">₹12,000</td>
                                <td>
                                    <form th:action="@{/admin/courses/{id}/toggle(id=${course.id})}" method="post" class="d-inline">
                                        <button type="submit" class="btn btn-sm border-0 p-0" title="Click to toggle status">
                                            <span th:if="${course.status == 'ACTIVE'}" class="badge-status-active"><i class="bi bi-check-circle me-1"></i> ACTIVE</span>
                                            <span th:if="${course.status != 'ACTIVE'}" class="badge-status-inactive"><i class="bi bi-pause-circle me-1"></i> INACTIVE</span>
                                        </button>
                                    </form>
                                </td>
                                <td class="text-end">
                                    <div class="btn-group btn-group-sm">
                                        <a th:href="@{/courses/{id}(id=${course.id})}" class="btn btn-light border" title="Preview Public Page">
                                            <i class="bi bi-eye"></i>
                                        </a>
                                        <a th:href="@{/admin/courses/edit/{id}(id=${course.id})}" class="btn btn-outline-primary" title="Edit Course">
                                            <i class="bi bi-pencil"></i> Edit
                                        </a>
                                        <form th:action="@{/admin/courses/{id}/delete(id=${course.id})}" method="post" class="d-inline" onsubmit="return confirm('Are you sure you want to deactivate this course?');">
                                            <button type="submit" class="btn btn-outline-danger" title="Deactivate">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
