<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${isEdit} ? 'Edit Course' : 'Create Course')}"></head>
<body>

    <header th:replace="~{fragments/layout :: navbar}"></header>
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <main class="py-5">
        <div class="container">
            <!-- Breadcrumbs -->
            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb small">
                    <li class="breadcrumb-item"><a th:href="@{/admin/dashboard}" class="text-decoration-none">Admin</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/admin/courses}" class="text-decoration-none">Courses</a></li>
                    <li class="breadcrumb-item active" aria-current="page" th:text="${isEdit} ? 'Edit Course' : 'New Course'">Action</li>
                </ol>
            </nav>

            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card border-0 shadow-lg rounded-4 overflow-hidden bg-white">
                        <div class="card-top-accent"></div>
                        <div class="p-4 p-md-5">
                            <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
                                <div class="stat-icon stat-icon-purple" style="width: 50px; height: 50px; font-size: 1.4rem;">
                                    <i class="bi bi-mortarboard-fill"></i>
                                </div>
                                <div>
                                    <h3 class="fw-bold mb-0" th:text="${isEdit} ? 'Edit Course Program' : 'Create New Course Program'">Course Form</h3>
                                    <small class="text-muted">Enter course specifications and registration details</small>
                                </div>
                            </div>

                            <form th:action="${isEdit} ? @{/admin/courses/edit/{id}(id=${courseDto.id})} : @{/admin/courses/new}" 
                                  th:object="${courseDto}" method="post">

                                <input type="hidden" th:field="*{id}" th:if="${isEdit}" />

                                <div class="row g-3">
                                    <div class="col-12">
                                        <label for="courseName" class="form-label">Course Title <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" id="courseName" th:field="*{courseName}" placeholder="e.g. Gen AI LLMs and Prototyping" required>
                                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('courseName')}" th:errors="*{courseName}"></div>
                                    </div>

                                    <div class="col-md-6">
                                        <label for="category" class="form-label">Category / Stream <span class="text-danger">*</span></label>
                                        <select class="form-select" id="category" th:field="*{category}" required>
                                            <option value="">-- Select Category --</option>
                                            <option value="Web Technologies & Full Stack">Web Technologies & Full Stack</option>
                                            <option value="Data Science & AI">Data Science & AI</option>
                                            <option value="Mobile Development">Mobile Development</option>
                                            <option value="Cyber Security">Cyber Security</option>
                                            <option value="Embedded & Hardware">Embedded & Hardware</option>
                                            <option value="Database & Backend">Database & Backend</option>
                                            <option value="Enterprise Java">Enterprise Java</option>
                                            <option value="Business Intelligence">Business Intelligence</option>
                                        </select>
                                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
                                    </div>

                                    <div class="col-md-6">
                                        <label for="duration" class="form-label">Duration <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" id="duration" th:field="*{duration}" placeholder="e.g. 8 Weeks, 3 Months" required>
                                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('duration')}" th:errors="*{duration}"></div>
                                    </div>

                                    <div class="col-md-6">
                                        <label for="fee" class="form-label">Training Fee (INR ₹) <span class="text-danger">*</span></label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light">₹</span>
                                            <input type="number" step="0.01" class="form-control" id="fee" th:field="*{fee}" placeholder="12000.00" required>
                                        </div>
                                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('fee')}" th:errors="*{fee}"></div>
                                    </div>

                                    <div class="col-md-6">
                                        <label for="status" class="form-label">Status <span class="text-danger">*</span></label>
                                        <select class="form-select" id="status" th:field="*{status}">
                                            <option value="ACTIVE">ACTIVE (Open for Registration)</option>
                                            <option value="INACTIVE">INACTIVE (Hidden / Closed)</option>
                                        </select>
                                    </div>

                                    <div class="col-12">
                                        <label for="description" class="form-label">Course Description & Objectives <span class="text-danger">*</span></label>
                                        <textarea class="form-control" id="description" th:field="*{description}" rows="4" placeholder="Detailed description of what students will learn, tools covered, and career outcomes..." required></textarea>
                                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                                    </div>
                                </div>

                                <hr class="my-4">

                                <h5 class="fw-bold text-dark mb-3"><i class="bi bi-camera-video text-primary me-2"></i>Virtual Classroom & Live Session Settings</h5>
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label for="trainerName" class="form-label">Assigned Lead Trainer</label>
                                        <input type="text" class="form-control" id="trainerName" th:field="*{trainerName}" placeholder="e.g. Dr. R. Vignesh Kumar">
                                    </div>

                                    <div class="col-md-6">
                                        <label for="trainerEmail" class="form-label">Trainer Contact Email</label>
                                        <input type="email" class="form-control" id="trainerEmail" th:field="*{trainerEmail}" placeholder="trainer@gatewaysoftwaresolutions.com">
                                    </div>

                                    <div class="col-12">
                                        <label for="trainerBio" class="form-label">Trainer Bio / Credentials</label>
                                        <textarea class="form-control" id="trainerBio" th:field="*{trainerBio}" rows="2" placeholder="Brief biography, architectural background, and industry credentials..."></textarea>
                                    </div>

                                    <div class="col-md-6">
                                        <label for="classSchedule" class="form-label">Live Batch Schedule</label>
                                        <input type="text" class="form-control" id="classSchedule" th:field="*{classSchedule}" placeholder="e.g. Mon - Fri, 10:00 AM - 12:00 PM IST">
                                    </div>

                                    <div class="col-md-6">
                                        <label for="meetingPlatform" class="form-label">Meeting Platform</label>
                                        <input type="text" class="form-control" id="meetingPlatform" th:field="*{meetingPlatform}" placeholder="e.g. Google Meet, Zoom">
                                    </div>

                                    <div class="col-md-6">
                                        <label for="meetingLink" class="form-label">Live Lecture Meeting Link (URL)</label>
                                        <input type="url" class="form-control" id="meetingLink" th:field="*{meetingLink}" placeholder="https://meet.google.com/xyz-abcd-efg">
                                    </div>

                                    <div class="col-md-6">
                                        <label for="materialsUrl" class="form-label">Code / Materials Repository (URL)</label>
                                        <input type="url" class="form-control" id="materialsUrl" th:field="*{materialsUrl}" placeholder="https://github.com/gatewaysoftwaresolutions/course-repo">
                                    </div>

                                    <div class="col-12">
                                        <label for="classroomNotice" class="form-label">Classroom Broadcast / Instructor Notice</label>
                                        <textarea class="form-control" id="classroomNotice" th:field="*{classroomNotice}" rows="2" placeholder="Important announcement or prerequisite instruction shown on student classroom hub..."></textarea>
                                    </div>
                                </div>

                                <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top">
                                    <a th:href="@{/admin/courses}" class="btn btn-outline-secondary">
                                        <i class="bi bi-x-circle"></i> Cancel
                                    </a>
                                    <button type="submit" class="btn-primary-gss btn-lg px-4">
                                        <i class="bi bi-check2-circle"></i> <span th:text="${isEdit} ? 'Update Course' : 'Save Course'">Save</span>
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
